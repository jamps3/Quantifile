name: Autoformat

on:
  push:
    branches: [main]
  pull_request:

jobs:
  autoformat:
    name: Autoformat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Check formatting
        run: python -m ruff format --check .
