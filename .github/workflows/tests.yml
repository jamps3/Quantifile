name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_PYTHON: "3.12"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python and development tools
        run: |
          uv python install "$UV_PYTHON"
          uv sync --locked --group dev

      - name: Compile
        run: uv run python -m compileall -q actions_controller.py app.py build.py layout.py main.py models.py render_controller.py scan_controller.py scanner.py settings_controller.py scripts tests

      - name: Test with coverage
        run: uv run python -m pytest
