name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_PYTHON: "3.12"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python and development tools
        run: |
          uv python install "$UV_PYTHON"
          uv sync --locked --group dev

      - name: Compile
        run: uv run python -m compileall -q actions_controller.py app.py build.py layout.py main.py models.py render_controller.py scan_controller.py scanner.py settings_controller.py scripts tests

      - name: Autoformat
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Count tests
        id: collect
        run: |
          count=$(uv run python -m pytest --collect-only -q -p no:cov | sed -n 's/^\([0-9][0-9]*\) tests collected.*$/\1/p')
          echo "count=${count:-0}" >> "$GITHUB_OUTPUT"

      - name: Test with coverage
        run: uv run python -m pytest

      - name: Generate Shields endpoints
        run: uv run python scripts/write_badges.py --test-count "${{ steps.collect.outputs.count }}"

      - name: Upload badge endpoints
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: badges
          publish_dir: badges
          destination_dir: badges
          keep_files: false
