[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=models",
    "--cov=layout",
    "--cov=scanner",
    "--cov-report=term-missing",
    "--cov-report=json:coverage.json",
    "--cov-fail-under=100",
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
