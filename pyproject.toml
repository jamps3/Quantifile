[project]
name = "quantifile"
version = "1.0.5"
description = "A Tkinter disk space visualization tool inspired by SpaceMonger."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.15,<0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-p",
    "no:cacheprovider",
    "--cov=models",
    "--cov=layout",
    "--cov=scanner",
    "--cov-report=term-missing",
    "--cov-report=json:coverage.json",
    "--cov-fail-under=100",
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
